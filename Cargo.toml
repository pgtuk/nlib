[package]
name = "nlib"
version = "1.1.0"
authors = ["Pe Tya <gtuk@duck.com>"]
edition = "2021"

[dependencies]
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5.0"
thiserror = "2.0"
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
